<svg xmlns="http://www.w3.org/2000/svg" width="780" height="516" viewBox="0 0 780 516" role="img" aria-labelledby="title desc">
<title id="title">AtliQ Contract Risk Analyzer: v1 vs v2 prototype comparison</title>
<desc id="desc">v1 Streamlit vs v2 React plus LLM-as-Judge. Latency about 8 to 12 s vs 14 to 18 s. Cost about $0.30 vs $0.33 per contract. Pieces to deploy 1 vs 2. LLM review stages 1 vs 2. Automated tests 13 vs 75.</desc>
<style>
text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#e6edf3}
.h{font-size:20px;font-weight:600} .sub{font-size:13px;fill:#9da7b3}
.t{font-size:14px;font-weight:600} .s{font-size:11.5px;fill:#9da7b3}
.v{font-size:12.5px;fill:#c9d1d9} .lg{font-size:13px} .f{font-size:11.5px;fill:#8b949e}
.ax{stroke:#484f58;stroke-width:1} .sep{stroke:#21262d;stroke-width:1}
</style>
<rect x="0.5" y="0.5" width="779" height="515" rx="12" fill="#0d1117" stroke="#30363d"/>
<text x="32" y="44" class="h">v1 vs v2 — same product, two prototypes</text>
<text x="32" y="66" class="sub">AtliQ Contract Risk Analyzer · what the LLM-as-Judge buys, and what it costs</text>
<rect x="32" y="82" width="12" height="12" rx="3" fill="#3987e5"/><text x="50" y="92" class="lg">v1 · Streamlit, single Claude pass</text>
<rect x="300" y="82" width="12" height="12" rx="3" fill="#d95926"/><text x="318" y="92" class="lg">v2 · React + FastAPI, two-stage judge on Groq</text>
<text x="32" y="134" class="t">Latency per review</text><text x="32" y="152" class="s">seconds, estimated · lower is better</text><line x1="230" y1="114" x2="230" y2="160" class="ax"/><path d="M230 118h131.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-131.0z" fill="#3987e5"><title>v1 · Latency per review: ~8–12 s</title></path><text x="373.0" y="130" class="v">~8–12 s</text><path d="M230 138h212.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-212.0z" fill="#d95926"><title>v2 · Latency per review: ~14–18 s</title></path><text x="454.0" y="150" class="v">~14–18 s</text><line x1="32" y1="178" x2="748" y2="178" class="sep"/><text x="32" y="208" class="t">Cost per contract</text><text x="32" y="226" class="s">USD, estimated · lower is better</text><line x1="230" y1="188" x2="230" y2="234" class="ax"/><path d="M230 192h198.5a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-198.5z" fill="#3987e5"><title>v1 · Cost per contract: ~$0.30</title></path><text x="440.5" y="204" class="v">~$0.30</text><path d="M230 212h218.75a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-218.75z" fill="#d95926"><title>v2 · Cost per contract: ~$0.33</title></path><text x="460.75" y="224" class="v">~$0.33</text><line x1="32" y1="252" x2="748" y2="252" class="sep"/><text x="32" y="282" class="t">Pieces to deploy</text><text x="32" y="300" class="s">setup complexity · lower is simpler</text><line x1="230" y1="262" x2="230" y2="308" class="ax"/><path d="M230 266h131.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-131.0z" fill="#3987e5"><title>v1 · Pieces to deploy: 1 · GitHub Pages, no server</title></path><text x="373.0" y="278" class="v">1 · GitHub Pages, no server</text><path d="M230 286h266.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-266.0z" fill="#d95926"><title>v2 · Pieces to deploy: 2 · Pages + Render API + secrets</title></path><text x="508.0" y="298" class="v">2 · Pages + Render API + secrets</text><line x1="32" y1="326" x2="748" y2="326" class="sep"/><text x="32" y="356" class="t">LLM review stages</text><text x="32" y="374" class="s">AI depth · higher is deeper</text><line x1="230" y1="336" x2="230" y2="382" class="ax"/><path d="M230 340h131.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-131.0z" fill="#3987e5"><title>v1 · LLM review stages: 1 · single review pass</title></path><text x="373.0" y="352" class="v">1 · single review pass</text><path d="M230 360h266.0a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-266.0z" fill="#d95926"><title>v2 · LLM review stages: 2 · extract, then judge</title></path><text x="508.0" y="372" class="v">2 · extract, then judge</text><line x1="32" y1="400" x2="748" y2="400" class="sep"/><text x="32" y="430" class="t">Automated tests</text><text x="32" y="448" class="s">higher is better</text><line x1="230" y1="410" x2="230" y2="456" class="ax"/><path d="M230 414h39.875a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-39.875z" fill="#3987e5"><title>v1 · Automated tests: 13 · golden cases</title></path><text x="281.875" y="426" class="v">13 · golden cases</text><path d="M230 434h249.125a4 4 0 0 1 4 4v8a4 4 0 0 1-4 4h-249.125z" fill="#d95926"><title>v2 · Automated tests: 75 · 63 Python + 12 Vitest</title></path><text x="491.125" y="446" class="v">75 · 63 Python + 12 Vitest</text>
<text x="32" y="498" class="f">Latency and cost are estimates, not benchmarks. Each row has its own scale.</text>
</svg>
